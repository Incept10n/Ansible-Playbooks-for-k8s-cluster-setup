- name: Prepare all Kubernetes nodes
  hosts: myhosts
  become: true
  tasks:
    - name: Run the common node preparation tasks
      ansible.builtin.import_role:
        name: k8sCluster
        tasks_from: main

- name: Initialize the Kubernetes control plane
  hosts: master
  become: true
  tasks:
    - name: Run the control plane tasks
      ansible.builtin.import_role:
        name: k8sCluster
        tasks_from: control_plane
