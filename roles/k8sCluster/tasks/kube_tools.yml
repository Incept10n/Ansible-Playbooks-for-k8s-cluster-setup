- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true

- name: Install apt-transport-https ca-certificates curl gpg
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the public signing key for the Kubernetes package repositories
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key"
    dest: /tmp/kubernetes-Release.key
    mode: "0644"
    timeout: 30

- name: Dearmor the Kubernetes signing key into /etc/apt/keyrings
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - -o
      - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      - /tmp/kubernetes-Release.key
  changed_when: false

- name: Add the appropriate Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /\n"
    mode: "0644"

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true

- name: Install kubelet kubeadm kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Mark kubelet, kubeadm, and kubectl on hold
  ansible.builtin.command: apt-mark hold kubelet kubeadm kubectl
  changed_when: false

- name: Enable the kubelet service before running kubeadm
  ansible.builtin.shell: systemctl enable --now kubelet
  changed_when: false
