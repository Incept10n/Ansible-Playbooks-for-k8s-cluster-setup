- name: Download and apply the Calico manifest
  ansible.builtin.shell: |
    kubectl apply --kubeconfig=/etc/kubernetes/admin.conf -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
  args:
    chdir: /tmp
  register: calico_install_output
  changed_when: false

- name: Show the output of the Calico installation
  ansible.builtin.debug:
    msg: "{{ calico_install_output.stdout }}"
