- name: Download the Calico manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"
    dest: /tmp/calico.yaml
    mode: "0644"
    timeout: 30

- name: Apply the Calico manifest
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -f
      - /tmp/calico.yaml
  register: calico_install_output
  changed_when: false

- name: Show the output of the Calico installation
  ansible.builtin.debug:
    msg: "{{ calico_install_output.stdout }}"
